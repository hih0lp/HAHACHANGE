services:
  api:
    environment:
      CALENDAR_MCP_URL: http://calendar-integration:8080/mcp
  worker:
    environment:
      CALENDAR_MCP_URL: http://calendar-integration:8080/mcp
  calendar-integration:
    build:
      context: .
      dockerfile: Dockerfile.calendar-integration
    environment:
      TEAM_DIRECTORY_URL: http://team-access:8080
      CALENDAR_DEMO_SUBJECT: ${CALENDAR_DEMO_SUBJECT:?Set the demo team subject}
      CALENDAR_ONBOARDING_ID: ${CALENDAR_ONBOARDING_ID:?Set the onboarding calendar ID}
      CALENDAR_MENTOR_ID: ${CALENDAR_MENTOR_ID:?Set the mentor calendar ID}
      GOOGLE_CLIENT_ID_FILE: /run/secrets/google_client_id
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_REFRESH_TOKEN_FILE: /run/secrets/google_refresh_token
    secrets:
      - google_client_id
      - google_client_secret
      - google_refresh_token
secrets:
  google_client_id:
    file: ${GOOGLE_CLIENT_ID_PATH:?Set the Google OAuth client ID file}
  google_client_secret:
    file: ${GOOGLE_CLIENT_SECRET_PATH:?Set the Google OAuth client secret file}
  google_refresh_token:
    file: ${GOOGLE_REFRESH_TOKEN_PATH:?Set the Google OAuth refresh token file}

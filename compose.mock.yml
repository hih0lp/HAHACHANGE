services:
  gateway:
    volumes:
      - ./deploy/nginx.mock.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
  api:
    image: bobby-mocks-api:local
    environment:
      GITLAB_MCP_URL: http://mock-gitlab:8080/mcp
      GITLAB_REMINDER_PROJECT: "2"
  worker:
    image: bobby-mocks-api:local
    environment:
      GITLAB_MCP_URL: http://mock-gitlab:8080/mcp
  mock-gitlab:
    build:
      context: .
      dockerfile: Dockerfile.gitlab-integration
    environment:
      GITLAB_MODE: mock
  team-access:
    image: bobby-mocks-team-access:local
  access-rights:
    image: bobby-mocks-team-access:local
    environment:
      TEAM_ACCESS_SEED_RESOURCES_FILE: /fixtures/resources.json
    volumes:
      - ./fixtures/mock/resources.json:/fixtures/resources.json:ro

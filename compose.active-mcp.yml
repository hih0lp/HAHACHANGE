# Keep GitLab MCP on the distributed network. Jira and Calendar are supplied
# by the editable mock services in compose.distributed.yml.
services:
  api:
    environment:
      GITLAB_MCP_URL: http://bobby-gitlab-mcp-demo:8080/mcp
      GITLAB_REMINDER_PROJECT: "2"
  worker:
    environment:
      GITLAB_MCP_URL: http://bobby-gitlab-mcp-demo:8080/mcp
